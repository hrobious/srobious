<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ==============================
         BASIC SEO
    =============================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Robious Sunny — Official Website</title>

    <meta name="description"
          content="Welcome to the official website of Robious Sunny. A heartful greetings from Robious Sunny.">

    <meta name="author" content="Robious Sunny">

    <meta name="robots"
          content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">

    <link rel="canonical" href="https://yourdomain.com/">

    <!-- ==============================
         OPEN GRAPH
    =============================== -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Robious Sunny — Official Website">
    <meta property="og:description"
          content="A heartful greetings from Robious Sunny.">
    <meta property="og:url" content="https://yourdomain.com/">
    <meta property="og:site_name" content="Robious Sunny">

    <!-- Replace with your own image later -->
    <meta property="og:image"
          content="https://yourdomain.com/og-image.jpg">

    <!-- ==============================
         TWITTER / X
    =============================== -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Robious Sunny — Official Website">
    <meta name="twitter:description"
          content="A heartful greetings from Robious Sunny.">
    <meta name="twitter:image"
          content="https://yourdomain.com/og-image.jpg">

    <!-- ==============================
         FAVICON
    =============================== -->
    <link rel="icon" href="/favicon.ico">

    <!-- ==============================
         GOOGLE / SCHEMA.ORG
    =============================== -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Robious Sunny",
        "alternateName": "Robious Sunny Official Website",
        "url": "https://yourdomain.com/"
    }
    </script>

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Robious Sunny",
        "url": "https://yourdomain.com/"
    }
    </script>

    <!-- ==============================
         STYLES
    =============================== -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            width: 100%;
            height: 100%;
            scroll-behavior: smooth;
        }

        body {
            width: 100%;
            min-height: 100%;
            background:
                radial-gradient(
                    circle at 50% 40%,
                    rgba(255, 255, 255, 0.08),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #070707 0%,
                    #111111 45%,
                    #050505 100%
                );

            color: #ffffff;
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            overflow: hidden;
        }

        /* ==============================
           BACKGROUND
        =============================== */

        .background {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .orb {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.12;
        }

        .orb-one {
            top: -250px;
            left: -150px;
            background: #ffffff;
        }

        .orb-two {
            right: -250px;
            bottom: -250px;
            background: #6b7280;
        }

        .noise {
            position: absolute;
            inset: 0;
            opacity: 0.035;
            background-image:
                url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
        }

        /* ==============================
           MAIN
        =============================== */

        main {
            position: relative;
            z-index: 1;

            min-height: 100vh;
            min-height: 100svh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;
            text-align: center;
        }

        .content {
            max-width: 900px;
            animation: reveal 1.4s cubic-bezier(.16, 1, .3, 1) forwards;
        }

        /* ==============================
           TEXT
        =============================== */

        .welcome {
            font-size: clamp(3.5rem, 10vw, 8rem);
            line-height: 0.95;
            font-weight: 200;
            letter-spacing: -0.055em;

            color: #ffffff;

            text-shadow:
                0 0 30px rgba(255,255,255,0.08);

            margin-bottom: 32px;
        }

        .greeting {
            font-size: clamp(1.05rem, 2vw, 1.5rem);
            line-height: 1.6;

            font-weight: 300;
            letter-spacing: 0.02em;

            color: rgba(255,255,255,0.72);
        }

        .name {
            color: #ffffff;
            font-weight: 500;
        }

        /* ==============================
           DECORATIVE LINE
        =============================== */

        .line {
            width: 70px;
            height: 1px;
            margin: 0 auto 30px;

            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,0.8),
                transparent
            );

            animation: lineReveal 1.8s ease forwards;
        }

        /* ==============================
           FOOTER
        =============================== */

        footer {
            position: fixed;
            bottom: 24px;
            left: 0;
            right: 0;

            z-index: 2;

            text-align: center;

            font-size: 11px;
            letter-spacing: 0.15em;
            text-transform: uppercase;

            color: rgba(255,255,255,0.28);
        }

        /* ==============================
           ANIMATIONS
        =============================== */

        @keyframes reveal {
            from {
                opacity: 0;
                transform: translateY(25px);
                filter: blur(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        @keyframes lineReveal {
            from {
                width: 0;
                opacity: 0;
            }

            to {
                width: 70px;
                opacity: 1;
            }
        }

        /* ==============================
           MOBILE
        =============================== */

        @media (max-width: 600px) {

            main {
                padding: 24px;
            }

            .welcome {
                margin-bottom: 24px;
            }

            .greeting {
                max-width: 330px;
                margin: auto;
            }

            .orb {
                width: 300px;
                height: 300px;
                filter: blur(90px);
            }

            footer {
                bottom: 16px;
                font-size: 9px;
            }
        }

        /* ==============================
           REDUCED MOTION
        =============================== */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>

<body>

    <!-- Decorative background -->
    <div class="background" aria-hidden="true">
        <div class="orb orb-one"></div>
        <div class="orb orb-two"></div>
        <div class="noise"></div>
    </div>

    <!-- ==============================
         MAIN LANDING PAGE
    =============================== -->
    <main>

        <section class="content"
                 aria-labelledby="welcome-title">

            <h1 id="welcome-title" class="welcome">
                Welcome
            </h1>

            <div class="line" aria-hidden="true"></div>

            <p class="greeting">
                A heartful greetings From
                <span class="name">Robious Sunny</span>
            </p>

        </section>

    </main>

    <footer>
        Robious Sunny
    </footer>

</body>
</html>
