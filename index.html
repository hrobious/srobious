<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f5f5f5;
    color:#222;
}

.container{
    text-align:center;
    padding:50px;
    background:#fff;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
    max-width:500px;
    width:90%;
}

h1{
    font-size:2.5rem;
    margin-bottom:15px;
    font-weight:700;
}

p{
    color:#666;
    margin-bottom:30px;
    line-height:1.6;
}

button{
    padding:12px 28px;
    border:none;
    border-radius:8px;
    background:#111;
    color:#fff;
    cursor:pointer;
    font-size:16px;
    transition:.3s;
}

button:hover{
    background:#333;
    transform:translateY(-2px);
}
</style>

</head>
<body>

<div class="container">
    <h1>Welcome to My Website</h1>
    <p>Thanks for visiting. Enjoy exploring this simple and minimal website.</p>

    <button onclick="alert('Welcome! Have a great day 😊')">
        Get Started
    </button>
</div>

</body>
</html>
